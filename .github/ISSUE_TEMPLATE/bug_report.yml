name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. make up
        2. Create a sheet, add an agent column, Fill ...
        3. ...
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Area
      options:
        - Sheets / columns
        - Agents / fills
        - AI and search providers
        - Workflows / webhooks
        - Sign-in
        - Web UI
        - Setup / running locally
        - Other
  - type: textarea
    attributes:
      label: Environment
      placeholder: "OS, how you run it (docker compose), the AI provider and model, git SHA (`git rev-parse --short HEAD`) or the release version"
    validations:
      required: true
  - type: textarea
    attributes:
      label: Relevant logs
      description: "From `make logs` (or a narrower `make logs-core` / `make logs-worker`). Redact secrets."
      render: shell
