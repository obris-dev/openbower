name: Feature request
description: Suggest a tool, a provider, or a capability
labels: ["enhancement"]
body:
  - type: textarea
    attributes:
      label: The problem
      description: What are you trying to do that's hard or impossible today?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed solution
      description: Optional. What would you like to see?
  - type: dropdown
    attributes:
      label: Area
      options:
        - Sheets / columns
        - Agents / fills
        - AI and search providers
        - Workflows / webhooks
        - Sign-in
        - Web UI
        - Setup / running locally
        - Other
