# The CI skeleton: every later phase EXTENDS this file with the lint and
# test jobs for the code it adds; nothing is scaffolded ahead of need.
name: ci

on:
  pull_request:

permissions:
  contents: read

# One run per PR (or per branch): a new push cancels the run still in
# flight for the previous commit, so only the newest commit is checked.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  branch-name:
    # Runs for every PR, a fork's included: a required check that never
    # reports leaves the PR unmergeable, and the worst a fork can do by
    # editing the script is pass its own branch name.
    runs-on: ubuntu-latest
    env:
      HEAD_REF: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@v4
      - name: Branch name follows <type>/<kebab-slug>
        run: sh scripts/check-branch-name.sh "$HEAD_REF"

  # The stack file is the only way to run the app, so a malformed anchor,
  # a bad depends_on condition, or an env_file path that only resolves on
  # the author's machine fails here rather than on a contributor's first
  # clone.
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q

  # Every script under scripts/ is POSIX sh: the installer runs under
  # `curl | sh` on a machine with no bash guarantee, and the operator
  # command rides the same path. The runner image ships shellcheck; the
  # install is the fallback for an image that does not.
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every script is POSIX sh
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update && sudo apt-get install -y shellcheck; }
          find scripts -name '*.sh' -print0 | xargs -0 shellcheck -s sh
      # The operator command's helpers against known inputs (the file
      # writers parsed back as TOML, the rc append, the URL rewrite).
      - name: The operator command's function tests
        run: sh scripts/tests/bower-admin-functions.sh

  lint-python:
    runs-on: ubuntu-latest
    # The path filter lists the PR's changed files through the API,
    # which a public repo serves to anyone; claimed here so the job
    # does not depend on that.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: .github/lane-inputs.yml
      - uses: astral-sh/setup-uv@v5
        if: steps.filter.outputs.python == 'true'
        with:
          # The uv the images build with, so one uv owns the lock.
          version: "0.12.x"
      # Before the sync, which would silently rewrite a stale lock: a
      # release bump that missed its re-lock, or a hand-edited manifest,
      # fails here instead.
      - run: uv lock --check
        if: steps.filter.outputs.python == 'true'
      - run: uv sync --all-packages
        if: steps.filter.outputs.python == 'true'
      - run: uv run ruff check .
        if: steps.filter.outputs.python == 'true'
      - run: uv run ruff format --check .
        if: steps.filter.outputs.python == 'true'
      - name: Contract is current
        if: steps.filter.outputs.python == 'true'
        run: uv run python -m tools.schema_sync.generate --check

  test-core:
    runs-on: ubuntu-latest
    # The path filter lists the PR's changed files through the API,
    # which a public repo serves to anyone; claimed here so the job
    # does not depend on that.
    permissions:
      contents: read
      pull-requests: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: openbower
          POSTGRES_USER: openbower
          POSTGRES_PASSWORD: openbower
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U openbower"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: .github/lane-inputs.yml
      - uses: astral-sh/setup-uv@v5
        if: steps.filter.outputs.python == 'true'
      - run: uv sync --all-packages
        if: steps.filter.outputs.python == 'true'
      - name: Migrations are complete
        if: steps.filter.outputs.python == 'true'
        # A model edit whose migration was never generated ships as a
        # first-boot crash for whoever migrates next; fail it here.
        run: cd apps/core && uv run python manage.py makemigrations --check --dry-run
        env:
          DJANGO_ENV: test
          DJANGO_SECRET_KEY: test-only
      - name: Run the app backend suite
        if: steps.filter.outputs.python == 'true'
        run: cd apps/core && uv run python manage.py test
        env:
          DJANGO_ENV: test
          DJANGO_SECRET_KEY: test-only

  web:
    runs-on: ubuntu-latest
    # The path filter lists the PR's changed files through the API,
    # which a public repo serves to anyone; claimed here so the job
    # does not depend on that.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: .github/lane-inputs.yml
      # No version pin: action-setup reads packageManager from
      # web/package.json, which is the one home for it (both web images
      # do the same via corepack).
      - uses: pnpm/action-setup@v4
        if: steps.filter.outputs.web == 'true'
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        if: steps.filter.outputs.web == 'true'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: cd web && pnpm install --frozen-lockfile
        if: steps.filter.outputs.web == 'true'
      - run: cd web && pnpm -r lint
        if: steps.filter.outputs.web == 'true'
      - run: cd web && pnpm -r typecheck
        if: steps.filter.outputs.web == 'true'
      - run: cd web && pnpm -r test
        if: steps.filter.outputs.web == 'true'
      # The zod side of the contract is generated; drift between the
      # committed output and the Pydantic-exported schema.json fails here.
      - run: cd web && pnpm --filter @bower/schema check
        if: steps.filter.outputs.web == 'true'
      # The real production build, the way the hosted workers are built.
      # Server/client directive violations (a "use client" export CALLED
      # from a server component) surface only in next build, which the
      # adapter runs through each package's own build script (the site's
      # copies scripts/install.sh into public/ first, so a moved or
      # missing installer fails here and not in the site's deploy). Then
      # the preview answers one request: a Next the adapter does not know
      # fails there and nowhere earlier.
      - name: The app's worker serves its login page
        if: steps.filter.outputs.web == 'true'
        run: sh scripts/tests/worker-smoke.sh @bower/app web/apps/app /login 8790
      - name: The site's worker serves a page
        if: steps.filter.outputs.web == 'true'
        run: sh scripts/tests/worker-smoke.sh @bower/marketing web/apps/marketing /privacy 8791

  # Both images build from a clean context and each one starts: the core
  # answers Django's system check, the web serves its login page. The
  # dev compose flow never exercises either Dockerfile's COPY list (it
  # mounts the source over the image), so a file the production build
  # lacks would otherwise surface on main, after the merge. Once per
  # architecture the published images carry, each on its native runner,
  # so a Mac self-hoster's build is proven here and not at pull time.
  # Same Dockerfiles, contexts, and cache scopes as the publishing
  # workflow, nothing pushed. Each build step skips when its image's
  # inputs did not change. The legs report under the one `images` gate
  # below, which is the required check: a leg that never reports would
  # leave a PR unmergeable, and two legs would be two checks to require.
  image:
    name: images / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    # The path filter lists the PR's changed files through the API,
    # which a public repo serves to anyone; claimed here so the job
    # does not depend on that.
    permissions:
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: .github/image-inputs.yml
      - uses: docker/setup-buildx-action@v3
        if: steps.filter.outputs.core == 'true' || steps.filter.outputs.web == 'true'

      - uses: docker/build-push-action@v6
        if: steps.filter.outputs.core == 'true'
        with:
          context: .
          file: apps/core/Dockerfile
          load: true
          tags: openbower-core:ci
          cache-from: type=gha,scope=openbower-core-${{ matrix.arch }}
          cache-to: type=gha,scope=openbower-core-${{ matrix.arch }},mode=max
      - name: The core image starts
        if: steps.filter.outputs.core == 'true'
        run: sh scripts/tests/image-smoke.sh core openbower-core:ci

      - uses: docker/build-push-action@v6
        if: steps.filter.outputs.web == 'true'
        with:
          context: web
          file: web/apps/app/Dockerfile
          load: true
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8002
            NEXT_PUBLIC_AUTH_URL=https://auth.openbower.ai
          tags: openbower-web:ci
          cache-from: type=gha,scope=openbower-web-${{ matrix.arch }}
          cache-to: type=gha,scope=openbower-web-${{ matrix.arch }},mode=max
      - name: The web image serves its login page and sends a signed-out browser to its backend
        if: steps.filter.outputs.web == 'true'
        run: sh scripts/tests/image-smoke.sh web openbower-web:ci

  # The one check to require for the images: green only when every leg
  # succeeded. `always()` so it reports when a leg failed or was
  # cancelled, instead of being skipped with it.
  images:
    needs: image
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.image.result }}
        run: |
          echo "image legs: ${RESULT}"
          [ "$RESULT" = "success" ]
