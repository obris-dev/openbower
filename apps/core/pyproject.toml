# No [build-system]/packages block: core is a Django app run via manage.py
# and `uv run`, never built or installed as a wheel. uv treats it as a virtual
# workspace member (its deps resolve, its code is never packaged).

[project]
name = "openbower-core"
version = "0.1.0"
description = "OpenBower core, the Django backend for the prospecting domain."
requires-python = ">=3.13"
dependencies = [
    "django>=6.0",
    "django-cors-headers>=4.6",
    "djangorestframework>=3.15",
    "cryptography>=43",
    "httpx>=0.28",
    "openbower-kernel",
    "openbower-schema",
    "psycopg>=3.3",
    "python-dotenv>=1.1",
    "ulid>=1.1",
    "pydantic-ai-slim[anthropic,duckduckgo,openai]>=2.32.0",
    # Reached by PRIVATE paths (the engine class and its exceptions in
    # agents/search.py), which a minor bump can move: an ImportError
    # there kills the whole agents app at import time, so the pin is
    # deliberately tight and bumps are a reviewed change.
    "ddgs>=9.15,<9.16",
]

[dependency-groups]
dev = [
    # psycopg's prebuilt binary (bundles libpq) for frictionless local dev;
    # the cloud image compiles psycopg[c] against system libpq instead.
    "psycopg[binary]>=3.3",
    "ruff>=0.11",
]
# Cloud-only (matches DJANGO_ENV=cloud / conf.settings.cloud). NOT installed
# by a default `uv sync`; the cloud image opts in with `uv sync --group cloud`.
cloud = [
    "gunicorn>=23.0",
    "psycopg[c]>=3.3",
]

[tool.uv.sources]
openbower-kernel = { workspace = true }
openbower-schema = { workspace = true }
