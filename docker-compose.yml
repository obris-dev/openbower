# The full local stack for the open app: db, the Django api, the two
# fill workers (normal and test), the maintenance cron, and the web
# dev servers. `make up` runs it; the containers
# bind-mount the checkout, so edits hot-reload without a rebuild.
#
# The project name is PINNED so every checkout of this repo (a worktree,
# a renamed clone) resolves to ONE project instead of a rival stack whose
# containers do not collide but whose published ports do.
name: openbower

# The core image's shared definition, at the top level rather than on any
# one service: whichever service is deleted first must not take the build,
# the env, or the gateway mapping with it.
x-core-build: &core_build
  # Build context = repo root: the uv workspace's single lock + every
  # member pyproject live there; Dockerfile is the core member's.
  context: .
  dockerfile: apps/core/Dockerfile

# Optional: `make up` seeds it from .env.example, and the bind mount
# lets manage.py's own dotenv load it at runtime anyway; a hard
# requirement here would fail every compose command (db-up included) on a
# checkout that hasn't run `make up` yet.
x-core-env-file: &core_env_file
  - path: ./apps/core/.env
    required: false

x-core-env: &core_env
  # This stack IS the local profile by construction, so the profile rides
  # here (authoritative over the env file) rather than trusting every .env
  # to say it.
  DJANGO_ENV: local
  # The network topology, overriding local.py's localhost seeds. Identity
  # URLs (OPENBOWER_AUTH_URL, OPENBOWER_DATA_URL) are deliberately ABSENT
  # here: they name the services for the browser and for the token's
  # resource indicators, so they stay on localhost. Only transport moves.
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  # By SERVICE NAME over the shared suite network, not through the host
  # gateway: a loopback-published port (which is how those services are
  # published, and should be) is unreachable from a container on Linux,
  # where the gateway is the bridge IP rather than the host's loopback.
  # Overridable, so a deployment pointing at its own IdP is not stuck with
  # the sibling dev stack's service names.
  OPENBOWER_AUTH_INTERNAL_URL: ${OPENBOWER_AUTH_INTERNAL_URL:-http://auth:8001}
  OPENBOWER_DATA_INTERNAL_URL: ${OPENBOWER_DATA_INTERNAL_URL:-http://data:8003}
  # The ingest bus, by service name over this stack's default network. Set
  # here (not in local.py's localhost seeds) because only the containers
  # reach the broker; a host-run process without it falls back to the
  # log-and-drop publisher. The web (producer) and ingest-worker (consumer)
  # both read it.
  INGEST_KAFKA_BOOTSTRAP_SERVERS: ${INGEST_KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}

x-host-gateway: &host_gateway
  # For the genuinely HOST-run process (Ollama). Docker Desktop maps
  # host.docker.internal automatically; Linux does not, so map it
  # explicitly or the call dies in DNS. Note that on Linux this reaches
  # the bridge IP, so a host process must listen beyond loopback for a
  # container to reach it (OLLAMA_HOST=0.0.0.0 for Ollama's default).
  - "host.docker.internal:host-gateway"

# Bind the whole workspace for hot-reload (canonical uv pattern); the
# anonymous volume keeps the .venv the image built OFF the bind mount, so
# the container's linux venv never lands in the host checkout.
x-core-volumes: &core_volumes
  - .:/app
  - /app/.venv

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: openbower
      POSTGRES_USER: openbower
      POSTGRES_PASSWORD: openbower
    # Published on 5433, not 5432, so this db never collides with another
    # Postgres already on the host's default port (suite convention);
    # host-run tests and psql use 5433. Loopback only: the published port
    # is for this machine, and sibling containers reach it as `db:5432`.
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      # Named, so the data survives `make down` and dies only with the
      # explicit `make reset`. An anonymous volume would be orphaned on
      # every down instead, leaking a full data directory per cycle.
      - bower_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openbower"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The ingest bus: single-node Kafka in KRaft mode (no ZooKeeper). The
  # webhook (in core) produces accepted row batches here; ingest-worker
  # consumes them. EPHEMERAL in the local profile on purpose: the durable
  # ingest state is the inbox table in Postgres (dedupe), so a dev bus needs
  # no volume and a `make down` may drop in-flight messages; a deployment
  # persists log.dirs. Reached only by sibling containers as `kafka:9092`.
  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      # Single broker, so every replication factor is 1 (the defaults assume
      # a cluster and would leave the internal topics under-replicated).
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      # The broker half of the one-message-per-batch sizing: MUST be >= the
      # app's INGEST_MAX_MESSAGE_BYTES (4 MiB), which drives the topic,
      # producer, and consumer limits.
      KAFKA_MESSAGE_MAX_BYTES: "4194304"
      # Topics are declared, not guessed: kafka-setup provisions them from the
      # catalog with the right partitions/retention/size, so a stray produce
      # must NOT auto-create a default-configured topic.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # One-shot pre-start setup, run once per `up` and gated before core,
  # both fill workers, and the cron start (all four depend_on it:
  # service_completed_successfully).
  # Migrate rides here because the local profile's loop is zero-step (a
  # fresh clone must serve after `make up` alone); keeping it OUT of
  # core's own command means restarting/rolling core alone doesn't re-run
  # it.
  core-setup:
    build: *core_build
    image: &core_image openbower-core:local
    command: sh -c "uv run --frozen --package openbower-core python apps/core/manage.py migrate --no-input
      && uv run --frozen --package openbower-core python apps/core/manage.py createcachetable"
    env_file: *core_env_file
    environment: *core_env
    depends_on:
      db:
        condition: service_healthy
    volumes: *core_volumes
    extra_hosts: *host_gateway

  core:
    # core-setup owns the `build:` and every other core service just names
    # the image: five services declaring one build target would race to
    # write the same tag. Every one of them depends on core-setup, so the
    # image is always built before they start. Pre-start setup lives there too,
    # so restarting/rolling core alone doesn't re-run it.
    image: *core_image
    command: uv run --frozen --package openbower-core python apps/core/manage.py runserver 0.0.0.0:8002
    # Loopback only: this is a DEBUG server holding the operator's sheets
    # and provider access, and ALLOWED_HOSTS is no defense (the Host
    # header is caller-supplied). Sibling containers use `core:8002`.
    ports:
      - "127.0.0.1:8002:8002"
    env_file: *core_env_file
    environment: *core_env
    extra_hosts: *host_gateway
    networks: [default, suite]
    depends_on:
      core-setup:
        condition: service_completed_successfully
    volumes: *core_volumes
    # A boot failure here should stay loud rather than loop, so no restart
    # policy; a deployed profile supplies its own supervision.
    #
    # Probes /healthz via stdlib urllib (no wget/curl in the image).
    # urlopen raises HTTPError on 503 so a degraded DB/cache fails the
    # check just as cleanly as the server being down. The start period
    # covers a cold first start, where `uv run` re-syncs the venv from
    # the network before Django serves anything.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/healthz', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 300s

  # The api above RELOADS on edit (runserver + the bind mount). The worker
  # does not, and cannot: a custom command gets no reloader, and a reloader
  # kills and respawns, which would drop a row mid flight against a metered
  # provider. A change to worker code needs `make restart-worker`, and a
  # restart resumes whatever fill was live. Compose runs exactly ONE
  # worker PER KIND: disjoint kinds claim disjoint fills, and the test
  # lane rides above this worker's width on a shared source: one row
  # per test fill, bounded by the live test fills (the one-live-test
  # rule is per account and advisory), not by one; a second claimer
  # of the SAME kind would double the load unbounded.
  worker:
    image: *core_image
    command: uv run --frozen --package openbower-core python apps/core/manage.py fill_worker --kinds normal
    env_file: *core_env_file
    environment: *core_env
    extra_hosts: *host_gateway
    # Deliberately NOT on the suite network: nothing in the fill path
    # calls the IdP or the data service, and `worker` is a name the other
    # stack also uses, so joining would put two A records behind it.
    depends_on:
      core-setup:
        condition: service_completed_successfully
    volumes: *core_volumes
    # No restart policy, matching core above: in the local profile a crash
    # is a signal to read. Every restart policy has the daemon-startup
    # property, `on-failure` included (a drain longer than dockerd's
    # shutdown timeout exits non-zero, which qualifies), so any of them
    # brings the worker back ALONE against a db and core that carry none.
    # The routine failures are already handled in the loop: a DatabaseError
    # idles and retries, and a per-fill exception is caught per fill.
    #
    # The worker traps SIGTERM/SIGINT and finishes the rows in flight; a
    # SIGKILL through the grace wastes a metered provider call AND burns
    # one of the row's counted attempts (attempts count at claim). The
    # grace clears the repo's own worst case for one row, the
    # runtime's cell_run_worst_case_seconds() (every completion the
    # budget allows, the capped verdict's own budget included, plus
    # every search at its clamped worst case; see agents/constants.py
    # for the derivation), with room to spare: the bound follows the
    # vendor registry and is not re-tightened here when a vendor
    # leaves, so the slack can be generous, and a grace set exactly
    # AT the maximum would SIGKILL the outcome write a bounded row
    # still owes. A parity test holds this value above the bound, so
    # the number here is never quietly below it. Docker's default 10s would kill through
    # nearly every real row. A stop during an active fill can
    # therefore take minutes; that wait is the point.
    stop_grace_period: 2100s

  # The TEST lane's worker: the same binary, claiming only test-kind
  # fills (the bench's one-row diagnostics), so bench latency never
  # queues behind a wide fill and a wedged fill worker cannot take
  # agent-configuration UX down. One row wide by construction (a test
  # fill has exactly one task), so no concurrency knob exists to set.
  # The SHORT grace is a deliberate trade, and it is effectively
  # always a kill: 32s is under one completion timeout, so an
  # in-flight bench row does not finish. What it costs is one metered
  # call, one of the row's counted attempts, and a poll that reads
  # live-but-silent until the lease goes stale
  # (ROW_LEASE_STALE_SECONDS) and the row is reclaimed; a bench run
  # is throwaway diagnostics, not work worth minutes of shutdown.
  worker-test:
    image: *core_image
    command: uv run --frozen --package openbower-core python apps/core/manage.py fill_worker --kinds test
    env_file: *core_env_file
    environment: *core_env
    extra_hosts: *host_gateway
    depends_on:
      core-setup:
        condition: service_completed_successfully
    volumes: *core_volumes
    stop_grace_period: 32s

  # One-shot: reconcile the broker to the ingest topic catalog (declared
  # partitions/retention/size), so topics are explicit rather than
  # auto-created with defaults. Idempotent, gated on kafka healthy + the
  # built image (core-setup). The web producer does NOT depend on this: a
  # produce before topics exist is a retryable 503, not a reason to block
  # web startup on the bus.
  kafka-setup:
    image: *core_image
    command: uv run --frozen --package openbower-core python apps/core/manage.py provision_topics
    env_file: *core_env_file
    environment: *core_env
    extra_hosts: *host_gateway
    depends_on:
      core-setup:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    volumes: *core_volumes

  # The ingest worker: consumes accepted row-push events off the bus,
  # dedupes them against the inbox, and applies (a log for now). Waits for
  # the topics to exist (kafka-setup) and the inbox migration (core-setup).
  # No restart policy, matching the fill workers: a crash is a signal in the
  # local profile, and the loop already idles-and-retries a DatabaseError.
  # The poll wakes every second, so SIGTERM stops it promptly (default grace).
  ingest-worker:
    image: *core_image
    command: uv run --frozen --package openbower-core python apps/core/manage.py ingest_worker
    env_file: *core_env_file
    environment: *core_env
    extra_hosts: *host_gateway
    depends_on:
      core-setup:
        condition: service_completed_successfully
      kafka-setup:
        condition: service_completed_successfully
    volumes: *core_volumes
    # Liveness: the consume loop touches /tmp/ingest_worker.heartbeat each
    # iteration, so a marker older than 30s means the loop WEDGED (not merely
    # idle on an empty bus, which still loops). Compose only SURFACES this as
    # unhealthy in `docker ps`; it does not restart an unhealthy container.
    # Acting on it is the deploy's job (a Swarm restart_policy, an autoheal
    # sidecar, or a Kubernetes liveness probe reading the same signal); local
    # keeps the fill workers' crash-is-a-signal convention (no restart policy).
    healthcheck:
      test:
        - CMD-SHELL
        - "test $(( $(date +%s) - $(stat -c %Y /tmp/ingest_worker.heartbeat 2>/dev/null || echo 0) )) -lt 30"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s

  # The suite's cron: supercronic (pinned in the core Dockerfile; the
  # image ships no crond) running the schedule in apps/core/crontab.
  # Jobs run independently on their own lines, so adding one never
  # queues it behind another; each command's own age baseline is the
  # guarantee, so a missed tick costs nothing and a doubled one is
  # harmless. Logs land on the container's log stream like every
  # other service.
  # No stop grace stated: Docker's default is enough, because every
  # crontab line is safe to miss (the file's own contract).
  cron:
    image: *core_image
    command: supercronic /app/apps/core/crontab
    env_file: *core_env_file
    environment: *core_env
    extra_hosts: *host_gateway
    depends_on:
      core-setup:
        condition: service_completed_successfully
    volumes: *core_volumes

  web:
    build: ./web
    working_dir: /web
    # pnpm itself is baked into the image (see web/Dockerfile). Install
    # still runs at start because the node_modules volume mounts would hide
    # anything baked in; `pnpm install` is a no-op when the lockfile
    # matches what's already in the volume. `--frozen-lockfile` because a
    # stale lockfile must refuse here rather than be silently rewritten
    # through the bind mount from a platform the host did not resolve on.
    # confirmModulesPurge=false because a container start has no TTY: pnpm
    # asks before replacing a node_modules laid out by an older major, and
    # an unanswered prompt aborts the start.
    # `pnpm dev` runs every app in parallel (the product app on 3003, the
    # marketing site on 3004; 3005 is reserved for the docs app when it
    # is rebuilt), one install for the whole workspace.
    command: sh -c "pnpm install --frozen-lockfile --config.confirmModulesPurge=false && pnpm dev"
    environment:
      # Browser-visible origins (NEXT_PUBLIC_* inlines at build/dev time).
      NEXT_PUBLIC_API_URL: http://localhost:8002
      NEXT_PUBLIC_AUTH_URL: http://localhost:8001
      NEXT_PUBLIC_APP_URL: http://localhost:3003
      # Server-side fetches cross the compose network instead; localhost
      # inside this container is this container. Read by @bower/api's
      # resolveApiBase (the app's SSR fetches) and the marketing session
      # probe, server-only in both.
      API_INTERNAL_URL: http://core:8002
    ports:
      - "127.0.0.1:3003:3003"
      - "127.0.0.1:3004:3004"
    volumes:
      - ./web:/web
      # One volume per node_modules and per build cache the workspace
      # creates. pnpm writes a node_modules into EVERY package with
      # dependencies (pnpm-workspace.yaml covers apps/* AND packages/*),
      # and an unmasked one lands in the host checkout carrying linux
      # symlinks into a store the host does not have, which breaks
      # host-run pnpm afterwards. A new workspace project needs a line
      # here.
      - bower_node_modules:/web/node_modules
      - bower_app_node_modules:/web/apps/app/node_modules
      - bower_marketing_node_modules:/web/apps/marketing/node_modules
      - bower_api_node_modules:/web/packages/api/node_modules
      - bower_auth_node_modules:/web/packages/auth/node_modules
      - bower_schema_node_modules:/web/packages/schema/node_modules
      - bower_ui_node_modules:/web/packages/ui/node_modules
      - bower_tailwind_node_modules:/web/packages/tailwind-config/node_modules
      - bower_eslint_node_modules:/web/packages/eslint-config/node_modules
      - bower_app_next:/web/apps/app/.next
      - bower_marketing_next:/web/apps/marketing/.next
    depends_on:
      # service_healthy (not the default service_started) means web only
      # starts once core's /healthz is green. Without this, web boots
      # while Django is still resolving uv venv + running migrations and
      # the first SSR fetches eat connection-refused.
      core:
        condition: service_healthy

# The cross-stack network: the identity provider and data service are a
# SEPARATE stack (a private repo in dev, the hosted services otherwise),
# and containers reach them by service name over this network. Declared
# external so neither stack owns it; `make up` creates it. With those
# services absent the name simply does not resolve, which is the same
# outcome as the port being closed.
# Service names on this network are a SHARED namespace across both
# stacks (core, auth, data today), so a name added here must not collide
# with one the other stack joins.
networks:
  suite:
    external: true
    name: openbower-suite

volumes:
  bower_pgdata:
  bower_node_modules:
  bower_app_node_modules:
  bower_marketing_node_modules:
  bower_api_node_modules:
  bower_auth_node_modules:
  bower_schema_node_modules:
  bower_ui_node_modules:
  bower_tailwind_node_modules:
  bower_eslint_node_modules:
  bower_app_next:
  bower_marketing_next:
