target-version = "py313"
line-length = 120

# uv-workspace member source roots so ruff's isort resolves first-party
# imports in each leaf.
src = ["apps/core", "packages/kernel/src", "packages/openbower-schema/src"]

# Django writes migrations; keep them byte-identical to `makemigrations`
# output so a regen produces no spurious diff.
extend-exclude = ["**/migrations/**"]

[lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "PIE", "T20", "SIM", "RUF"]
ignore = [
    "E501",    # line too long (handled by formatter)
    "RUF012",  # mutable class attributes (common in Django models)
    "SIM102",  # collapsible-if (nested ifs can be more readable)
]

[lint.isort]
known-first-party = ["conf"]

[format]
quote-style = "double"
