packages:
  - "apps/*"
  - "packages/*"

# Dependency build scripts do NOT run by default since pnpm 10, so the
# two that genuinely need theirs are named here: sharp is Next's image
# optimizer and unrs-resolver backs the eslint import resolver, and each
# ships a native binary its install script fetches or builds; esbuild
# and workerd are the OpenNext bundler and the local Workers runtime the
# marketing site's Cloudflare deploy runs on. A package added without a
# line here fails at RUNTIME, not at install.
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true

# One sharp for the workspace: Next's image optimizer already resolves
# the patched line, and the Workers dev runtime pins the one before it.
overrides:
  sharp: ">=0.35.5"
  # The OpenNext bundler's minifier pins an exact glob 10.3.3, whose CLI
  # takes a shell command from a flag; the override lifts it to the
  # patched 10.5 line without waiting on that package.
  "glob@>=10.2.0 <10.5.0": "^10.5.0"
  # The Workers dev runtime (miniflare, under wrangler and the OpenNext
  # adapter) pins an exact undici 7.29.1, short of the 7.30.1 fixes for
  # its TLS validation and denial-of-service advisories.
  "undici@>=7.0.0 <7.30.1": "^7.30.1"
